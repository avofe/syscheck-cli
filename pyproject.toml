[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syscheck-cli"
version = "0.6.1"
description = "System diagnostics CLI and TUI dashboard for CPU, RAM, GPU, disks, network, processes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Igor", email = "mazurenkoi70@gmail.com" }]
keywords = [
    "system", "diagnostics", "monitoring", "cli", "tui", "cpu", "ram",
    "processes", "network", "battery", "dashboard", "btop", "htop",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "textual>=0.80.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/avofe/syscheck-cli"
Repository = "https://github.com/avofe/syscheck-cli"
Issues = "https://github.com/avofe/syscheck-cli/issues"
Changelog = "https://github.com/avofe/syscheck-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
syscheck = "syscheck.cli:main"

[tool.setuptools.packages.find]
include = ["syscheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]